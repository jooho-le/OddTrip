name: Deploy backend to EC2

# main 브랜치에 백엔드 변경이 푸시되면 EC2에 SSH로 접속해
# git pull → docker compose 재빌드로 자동 배포한다.
# (배포 파일은 모두 backend/ 안에 있음: Dockerfile, docker-compose.yml, Caddyfile)
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행도 가능

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}       # EC2 Elastic IP
          username: ${{ secrets.EC2_USER }}   # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}     # EC2 접속용 개인키(.pem) 내용 전체
          script: |
            set -e
            cd ~/OddTrip
            git pull origin main
            cd backend
            docker compose up -d --build
            docker image prune -f
